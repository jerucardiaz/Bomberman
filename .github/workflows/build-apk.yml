name: Compilar Bomberman APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.5
        run: |
          curl -L --retry 8 --retry-delay 10 --retry-all-errors -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Crear app Android
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/example/bomberman
          mkdir -p android/app/src/main/res/mipmap-anydpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/drawable
          cp "$(find . -name index.html -not -path './android/*' | head -n 1)" android/app/src/main/assets/index.html

          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bomberman"
          include ':app'
          EOF

          cat > android/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > android/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.bomberman'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.bomberman'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Bomberman"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/drawable/ic_bg.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2E7D32" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#43A047" android:pathData="M0,0h54v54h-54z"/>
              <path android:fillColor="#43A047" android:pathData="M54,54h54v54h-54z"/>
          </vector>
          EOF

          cat > android/app/src/main/res/drawable/ic_fg.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#111111" android:pathData="M34,60a20,20 0 1,0 40,0a20,20 0 1,0 -40,0z"/>
              <path android:fillColor="#666666" android:pathData="M44,52a5,5 0 1,0 10,0a5,5 0 1,0 -10,0z"/>
              <path android:strokeColor="#A1887F" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M66,44L72,36"/>
              <path android:fillColor="#FF9800" android:pathData="M67,34a6,6 0 1,0 12,0a6,6 0 1,0 -12,0z"/>
              <path android:fillColor="#FFEB3B" android:pathData="M70,34a3,3 0 1,0 6,0a3,3 0 1,0 -6,0z"/>
          </vector>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2E7D32" android:pathData="M20,0h68a20,20 0 0 1 20,20v68a20,20 0 0 1 -20,20h-68a20,20 0 0 1 -20,-20v-68a20,20 0 0 1 20,-20z"/>
              <path android:fillColor="#111111" android:pathData="M26,62a28,28 0 1,0 56,0a28,28 0 1,0 -56,0z"/>
              <path android:fillColor="#666666" android:pathData="M37,52a7,7 0 1,0 14,0a7,7 0 1,0 -14,0z"/>
              <path android:strokeColor="#A1887F" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M70,38L80,26"/>
              <path android:fillColor="#FF9800" android:pathData="M75,24a7,7 0 1,0 14,0a7,7 0 1,0 -14,0z"/>
              <path android:fillColor="#FFEB3B" android:pathData="M78.5,24a3.5,3.5 0 1,0 7,0a3.5,3.5 0 1,0 -7,0z"/>
          </vector>
          EOF

          cat > android/app/src/main/java/com/example/bomberman/MainActivity.java << 'EOF'
          package com.example.bomberman;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
