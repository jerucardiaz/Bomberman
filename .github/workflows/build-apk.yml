name: Compilar Bomberman APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Crear app Android con WebView
        run: |
          mkdir -p bomberman-app/app/src/main/java/com/retro/bomberman
          mkdir -p bomberman-app/app/src/main/res/values
          mkdir -p bomberman-app/app/src/main/assets

          cp www/index.html bomberman-app/app/src/main/assets/index.html

          cat << 'EOF' > bomberman-app/settings.gradle
          rootProject.name = "BombermanRetro"
          include(":app")
          EOF

          cat << 'EOF' > bomberman-app/build.gradle
          plugins {
              id "com.android.application" version "8.2.2" apply false
          }
          EOF

          cat << 'EOF' > bomberman-app/app/build.gradle
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.retro.bomberman"
              compileSdk 34

              defaultConfig {
                  applicationId "com.retro.bomberman"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > bomberman-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Bomberman Retro</string>
          </resources>
          EOF

          cat << 'EOF' > bomberman-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > bomberman-app/app/src/main/java/com/retro/bomberman/MainActivity.java
          package com.retro.bomberman;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          gradle wrapper --gradle-version 8.5 --distribution-type bin --directory bomberman-app
          cd bomberman-app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman-Retro-APK
          path: bomberman-app/app/build/outputs/apk/debug/app-debug.apk
