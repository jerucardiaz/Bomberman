<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
body{margin:0;background:#1b1b1b;color:#fff;font-family:sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;margin:0 auto}
#i{padding:6px;font-size:16px}
#c{display:flex;justify-content:space-around;align-items:center;padding:8px}
button{width:64px;height:64px;font-size:26px;border-radius:50%;border:0;background:#555;color:#fff}
#b{width:90px;height:90px;background:#d32f2f;font-size:16px}
#m{width:36px;height:36px;font-size:18px;margin-left:8px;vertical-align:middle}
.pad{display:grid;grid-template-columns:64px 64px 64px;gap:4px}
</style></head><body>
<div id="i"><span id="t"></span><button id="m">🔊</button></div>
<canvas id="g"></canvas>
<div id="c">
<div class="pad"><span></span><button id="u">▲</button><span></span>
<button id="l">◀</button><button id="d">▼</button><button id="r">▶</button></div>
<button id="b">BOMBA</button></div>
<script>
const W=11,H=13,cv=document.getElementById('g'),x=cv.getContext('2d');
const T=Math.floor(Math.min(innerWidth/W,(innerHeight-250)/H));
cv.width=W*T;cv.height=H*T;
x.textAlign='center';x.textBaseline='middle';
let map,items,p,enemies,bombs,fires,lvl=1,state='menu',now=0;
const P={bombs:1,range:2,speed:0,lives:3};
function resetStats(){P.bombs=1;P.range=2;P.speed=0;P.lives=3;lvl=1;}

/* ---------- AUDIO ---------- */
let ac,master,mus,muted=false,nextT=0,step=0;
const MEL=[69,0,72,0,76,0,74,72, 71,0,67,0,69,0,0,0, 69,0,72,0,76,0,79,76, 74,0,72,0,71,69,67,0];
const ROOT=[45,41,48,43];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,t,d,ty,v,dest){
 const o=ac.createOscillator(),g=ac.createGain();
 o.type=ty;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+0.05);
}
function noise(t,d,v,dest){
 const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=ac.createBufferSource();s.buffer=b;
 const g=ac.createGain();g.gain.value=v;
 s.connect(g);g.connect(dest||master);s.start(t);
}
function playStep(s,t){
 const m=MEL[s];if(m)tone(mtof(m),t,.14,'square',.25,mus);
 const bar=s>>3,i=s&7;
 if(i%2==0)tone(mtof(ROOT[bar]+(i%4?12:0)),t,.2,'triangle',.5,mus);
 if(s%2==1)noise(t,.03,.15,mus);
 if(i==0||i==4)tone(60,t,.1,'sine',.8,mus);
}
function sched(){
 if(!ac)return;
 while(nextT<ac.currentTime+.25){playStep(step%32,nextT);nextT+=.16;step++;}
}
function initAudio(){
 if(!ac){
  const A=window.AudioContext||window.webkitAudioContext;
  if(!A)return;
  ac=new A();
  master=ac.createGain();master.gain.value=muted?0:.6;master.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=.35;mus.connect(master);
  nextT=ac.currentTime+.1;setInterval(sched,60);
 }
 if(ac.state=='suspended')ac.resume();
}
function sfx(n){
 if(!ac)return;const t=ac.currentTime;
 if(n=='put'){tone(300,t,.08,'square',.3);tone(200,t+.06,.08,'square',.3);}
 if(n=='boom'){noise(t,.5,.9);tone(90,t,.3,'sawtooth',.5);}
 if(n=='pow')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.1,'square',.3));
 if(n=='hurt')[400,300,200,120].forEach((f,i)=>tone(f,t+i*.08,.1,'sawtooth',.4));
 if(n=='win')[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,t+i*.12,.14,'square',.35));
 if(n=='lose')[330,294,262,196,165].forEach((f,i)=>tone(f,t+i*.2,.25,'triangle',.6));
}
document.addEventListener('visibilitychange',()=>{
 if(!ac)return;
 if(document.hidden)ac.suspend();else ac.resume();
});

/* ---------- JUEGO ---------- */
function init(){
 map=[];items=[];
 for(let r=0;r<H;r++){map[r]=[];items[r]=[];for(let c=0;c<W;c++){
  items[r][c]=0;
  if(r==0||c==0||r==H-1||c==W-1||(r%2==0&&c%2==0))map[r][c]=1;
  else map[r][c]=(Math.random()<0.45&&!(r<3&&c<3))?2:0;}}
 p={r:1,c:1,x:1,y:1,inv:1500,last:0};
 bombs=[];fires=[];enemies=[];
 const n=Math.min(2+lvl,7),ty=lvl==1?1:lvl==2?2:3;
 while(enemies.length<n){
  let r=1+Math.floor(Math.random()*(H-2)),c=1+Math.floor(Math.random()*(W-2));
  if(map[r][c]==0&&r+c>7){
   let t=Math.floor(Math.random()*ty);
   enemies.push({r,c,x:c,y:r,t,sp:[600,450,320][t],w:500});
  }
 }
}
function free(r,c){return r>=0&&c>=0&&r<H&&c<W&&map[r][c]==0&&!bombs.some(b=>b.r==r&&b.c==c);}
function mv(dr,dc){
 if(state!='play')return;
 if(now-p.last<170-P.speed*25)return;
 let r=p.r+dr,c=p.c+dc;
 if(free(r,c)){p.r=r;p.c=c;p.last=now;check();}
}
function bomb(){
 if(state!='play'||bombs.length>=P.bombs||bombs.some(b=>b.r==p.r&&b.c==p.c))return;
 bombs.push({r:p.r,c:p.c,t:2000,g:P.range});sfx('put');
}
function boom(b){
 if(!bombs.includes(b))return;
 bombs.splice(bombs.indexOf(b),1);
 const cells=[[b.r,b.c]];
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
  for(let k=1;k<=b.g;k++){
   const r=b.r+d[0]*k,c=b.c+d[1]*k;
   if(map[r][c]==1)break;
   cells.push([r,c]);
   if(map[r][c]==2){
    map[r][c]=0;
    if(Math.random()<.3)items[r][c]=['b','f','s'][Math.floor(Math.random()*3)];
    break;
   }
  }});
 cells.forEach(f=>fires.push({r:f[0],c:f[1],t:450}));
 sfx('boom');
 bombs.filter(o=>cells.some(f=>f[0]==o.r&&f[1]==o.c)).forEach(boom);
 check();
}
function hurt(){
 P.lives--;
 if(P.lives<=0){state='lose';sfx('lose');return;}
 sfx('hurt');
 p.r=1;p.c=1;p.x=1;p.y=1;p.inv=2000;
}
function check(){
 if(state!='play')return;
 const onFire=(r,c)=>fires.some(f=>f.r==r&&f.c==c);
 enemies=enemies.filter(e=>!onFire(e.r,e.c));
 if(p.inv<=0&&(onFire(p.r,p.c)||enemies.some(e=>e.r==p.r&&e.c==p.c)))hurt();
 const it=items[p.r][p.c];
 if(it&&state=='play'){
  items[p.r][p.c]=0;
  if(it=='b')P.bombs=Math.min(P.bombs+1,5);
  if(it=='f')P.range=Math.min(P.range+1,6);
  if(it=='s')P.speed=Math.min(P.speed+1,3);
  sfx('pow');
 }
 if(state=='play'&&enemies.length==0){state='win';sfx('win');}
}
function moveEnemy(e){
 const D=[[1,0],[-1,0],[0,1],[0,-1]];
 let d=null;
 if(e.t==1&&Math.random()<.6){
  const dr=p.r-e.r,dc=p.c-e.c;
  d=Math.abs(dr)>Math.abs(dc)?[Math.sign(dr),0]:[0,Math.sign(dc)];
  if(!free(e.r+d[0],e.c+d[1]))d=null;
 }
 if(!d)d=D[Math.floor(Math.random()*4)];
 const r=e.r+d[0],c=e.c+d[1];
 if(free(r,c)){e.r=r;e.c=c;}
}
function update(dt){
 bombs.slice().forEach(b=>{b.t-=dt;if(b.t<=0)boom(b);});
 fires.forEach(f=>f.t-=dt);fires=fires.filter(f=>f.t>0);
 enemies.forEach(e=>{e.w-=dt;if(e.w<=0){e.w=e.sp;moveEnemy(e);}});
 if(p.inv>0)p.inv-=dt;
 check();
}

/* ---------- DIBUJO ---------- */
function circ(cx,cy,r,col){x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
function rr(a,b,w,h,r,col){
 x.fillStyle=col;x.beginPath();x.moveTo(a+r,b);
 x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);
 x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();
}
function drawPlayer(cx,cy,s){
 circ(cx-s*.14,cy+s*.36,s*.1,'#263238');circ(cx+s*.14,cy+s*.36,s*.1,'#263238');
 rr(cx-s*.22,cy+s*.02,s*.44,s*.34,s*.1,'#1565c0');
 circ(cx,cy-s*.1,s*.3,'#e3f2fd');
 x.fillStyle='#1976d2';x.beginPath();x.arc(cx,cy-s*.1,s*.3,Math.PI,0);x.fill();
 rr(cx-s*.2,cy-s*.14,s*.4,s*.22,s*.08,'#ffe0b2');
 circ(cx-s*.08,cy-s*.04,s*.045,'#000');circ(cx+s*.08,cy-s*.04,s*.045,'#000');
 x.strokeStyle='#e53935';x.lineWidth=Math.max(2,s*.05);
 x.beginPath();x.moveTo(cx,cy-s*.4);x.lineTo(cx,cy-s*.44);x.stroke();
 circ(cx,cy-s*.44,s*.06,'#e53935');
}
function drawEnemy(cx,cy,s,t){
 const col=['#e53935','#8e24aa','#fb8c00'][t];
 if(t==0){
  x.fillStyle=col;x.beginPath();x.ellipse(cx,cy+s*.06,s*.36,s*.3,0,0,7);x.fill();
 }else if(t==1){
  x.fillStyle=col;x.beginPath();x.arc(cx,cy-s*.05,s*.32,Math.PI,0);x.fill();
  x.fillRect(cx-s*.32,cy-s*.05,s*.64,s*.3);
  circ(cx-s*.21,cy+s*.25,s*.11,col);circ(cx,cy+s*.25,s*.11,col);circ(cx+s*.21,cy+s*.25,s*.11,col);
 }else{
  circ(cx,cy,s*.27,col);
  for(let i=0;i<8;i++){const a=i*Math.PI/4;circ(cx+Math.cos(a)*s*.3,cy+Math.sin(a)*s*.3,s*.08,col);}
 }
 circ(cx-s*.12,cy-s*.05,s*.09,'#fff');circ(cx+s*.12,cy-s*.05,s*.09,'#fff');
 circ(cx-s*.12,cy-s*.03,s*.045,'#000');circ(cx+s*.12,cy-s*.03,s*.045,'#000');
 x.strokeStyle='#000';x.lineWidth=Math.max(2,s*.04);
 x.beginPath();x.moveTo(cx-s*.2,cy-s*.17);x.lineTo(cx-s*.05,cy-s*.12);
 x.moveTo(cx+s*.2,cy-s*.17);x.lineTo(cx+s*.05,cy-s*.12);x.stroke();
}
function drawBomb(cx,cy,s){
 const k=1+Math.sin(now/120)*.08;
 circ(cx,cy+s*.04,s*.34*k,'#111');circ(cx-s*.1,cy-s*.06,s*.08,'#666');
 x.strokeStyle='#a1887f';x.lineWidth=Math.max(2,s*.06);
 x.beginPath();x.moveTo(cx+s*.1,cy-s*.26);x.lineTo(cx+s*.2,cy-s*.38);x.stroke();
 circ(cx+s*.2,cy-s*.4,s*.07,Math.floor(now/100)%2?'#ffeb3b':'#ff5722');
}
function drawItem(a,b,k){
 const col={b:'#ffd600',f:'#ff6d00',s:'#29b6f6'}[k];
 rr(a+T*.15,b+T*.15,T*.7,T*.7,T*.12,col);
 x.fillStyle='#000';x.font='bold '+(T*.45)+'px sans-serif';
 x.fillText(k.toUpperCase(),a+T/2,b+T/2+T*.03);
}
function draw(){
 x.clearRect(0,0,cv.width,cv.height);
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  const a=c*T,b=r*T,m=map[r][c];
  x.fillStyle=(r+c)%2?'#43a047':'#4caf50';x.fillRect(a,b,T,T);
  if(m==1){
   x.fillStyle='#37474f';x.fillRect(a,b,T,T);
   x.fillStyle='#78909c';x.fillRect(a,b,T,T*.12);x.fillRect(a,b,T*.12,T);
   x.fillStyle='#546e7a';x.fillRect(a+T*.15,b+T*.15,T*.7,T*.7);
  }else if(m==2){
   x.fillStyle='#8d6e63';x.fillRect(a,b,T,T);
   x.fillStyle='#5d4037';
   x.fillRect(a,b+T*.33,T,T*.06);x.fillRect(a,b+T*.66,T,T*.06);
   x.fillRect(a+T*.5,b,T*.06,T*.33);x.fillRect(a+T*.25,b+T*.39,T*.06,T*.27);
   x.fillRect(a+T*.75,b+T*.39,T*.06,T*.27);x.fillRect(a+T*.5,b+T*.72,T*.06,T*.28);
  }else if(items[r][c])drawItem(a,b,items[r][c]);
 }
 fires.forEach(f=>{
  x.fillStyle='#ff6f00';x.fillRect(f.c*T,f.r*T,T,T);
  x.fillStyle='#ffee58';x.fillRect(f.c*T+T*.2,f.r*T+T*.2,T*.6,T*.6);
 });
 bombs.forEach(b=>drawBomb(b.c*T+T/2,b.r*T+T/2,T));
 enemies.forEach(e=>drawEnemy(e.x*T+T/2,e.y*T+T/2,T,e.t));
 if(!(p.inv>0&&Math.floor(now/100)%2))drawPlayer(p.x*T+T/2,p.y*T+T/2,T);
 document.getElementById('t').textContent='❤ '+P.lives+'  Nivel '+lvl+'  👾 '+enemies.length+'  💣'+P.bombs+' 🔥'+P.range+' ⚡'+P.speed;
 if(state!='play'){
  x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle='#fff';
  const tt=state=='menu'?'BOOM BOY':state=='win'?'¡NIVEL SUPERADO!':'PERDISTE';
  x.font='bold '+(state=='win'?T*.8:T*1.1)+'px sans-serif';
  x.fillText(tt,cv.width/2,cv.height/2-T*1.5);
  if(state=='menu')drawPlayer(cv.width/2,cv.height/2+T*.2,T*1.8);
  x.fillStyle='#fff';x.font=(T*.55)+'px sans-serif';
  x.fillText(state=='menu'?'Toca la pantalla para empezar':state=='win'?'Toca para el siguiente nivel':'Toca para reintentar',cv.width/2,cv.height/2+T*2.3);
 }
}
let last=0;
function loop(t){
 const dt=Math.min(50,t-last);last=t;now=t;
 if(state=='play')update(dt);
 const k=Math.min(1,dt*0.02);
 p.x+=(p.c-p.x)*k;p.y+=(p.r-p.y)*k;
 enemies.forEach(e=>{e.x+=(e.c-e.x)*k;e.y+=(e.r-e.y)*k;});
 draw();
 requestAnimationFrame(loop);
}

/* ---------- CONTROLES ---------- */
cv.addEventListener('pointerdown',()=>{
 initAudio();
 if(state=='menu'){resetStats();state='play';init();}
 else if(state=='win'){lvl++;state='play';init();}
 else if(state=='lose'){resetStats();state='play';init();}
});
function hold(id,f){
 const e=document.getElementById(id);let t;
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();f();clearInterval(t);t=setInterval(f,60);});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>clearInterval(t)));
}
hold('u',()=>mv(-1,0));hold('d',()=>mv(1,0));
hold('l',()=>mv(0,-1));hold('r',()=>mv(0,1));
document.getElementById('b').addEventListener('pointerdown',e=>{e.preventDefault();bomb();});
document.getElementById('m').addEventListener('pointerdown',e=>{
 e.preventDefault();muted=!muted;
 if(master)master.gain.value=muted?0:.6;
 e.target.textContent=muted?'🔇':'🔊';
});
init();requestAnimationFrame(loop);
</script></body></html>
