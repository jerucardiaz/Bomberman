<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
body{margin:0;background:#222;color:#fff;font-family:sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;margin:0 auto}
#i{padding:6px;font-size:16px}
#c{display:flex;justify-content:space-around;align-items:center;padding:8px}
button{width:64px;height:64px;font-size:26px;border-radius:50%;border:0;background:#555;color:#fff}
#b{width:90px;height:90px;background:#d32f2f;font-size:16px}
.pad{display:grid;grid-template-columns:64px 64px 64px;gap:4px}
</style></head><body>
<div id="i"></div>
<canvas id="g"></canvas>
<div id="c">
<div class="pad"><span></span><button id="u">▲</button><span></span>
<button id="l">◀</button><button id="d">▼</button><button id="r">▶</button></div>
<button id="b">BOMBA</button></div>
<script>
const W=11,H=13,cv=document.getElementById('g'),x=cv.getContext('2d');
const T=Math.floor(Math.min(innerWidth/W,(innerHeight-250)/H));
cv.width=W*T;cv.height=H*T;
let map,p,en,bombs,fires,lives=3,lvl=1,state='play';
function init(){
 map=[];
 for(let r=0;r<H;r++){map[r]=[];for(let c=0;c<W;c++){
  if(r==0||c==0||r==H-1||c==W-1||(r%2==0&&c%2==0))map[r][c]=1;
  else map[r][c]=(Math.random()<0.45&&!(r<3&&c<3))?2:0;}}
 p={r:1,c:1};bombs=[];fires=[];en=[];
 while(en.length<2+lvl){
  let r=1+Math.floor(Math.random()*(H-2)),c=1+Math.floor(Math.random()*(W-2));
  if(map[r][c]==0&&r+c>7)en.push({r,c});}
}
function free(r,c){return map[r][c]==0&&!bombs.some(b=>b.r==r&&b.c==c);}
function mv(dr,dc){
 if(state!='play')return;
 let r=p.r+dr,c=p.c+dc;
 if(free(r,c)){p.r=r;p.c=c;check();}
}
function bomb(){
 if(state!='play'||bombs.length>=2||bombs.some(b=>b.r==p.r&&b.c==p.c))return;
 let b={r:p.r,c:p.c};bombs.push(b);setTimeout(()=>boom(b),2000);
}
function boom(b){
 let i=bombs.indexOf(b);if(i<0)return;
 bombs.splice(i,1);
 let cells=[[b.r,b.c]];
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
  for(let k=1;k<=2;k++){
   let r=b.r+d[0]*k,c=b.c+d[1]*k;
   if(map[r][c]==1)break;
   cells.push([r,c]);
   if(map[r][c]==2){map[r][c]=0;break;}
  }});
 cells.forEach(f=>{
  fires.push(f);
  bombs.filter(o=>o.r==f[0]&&o.c==f[1]).forEach(boom);
 });
 setTimeout(()=>{fires=fires.filter(f=>!cells.includes(f))},400);
 check();
}
function check(){
 if(state!='play')return;
 en=en.filter(e=>!fires.some(f=>f[0]==e.r&&f[1]==e.c));
 if(fires.some(f=>f[0]==p.r&&f[1]==p.c)||en.some(e=>e.r==p.r&&e.c==p.c)){
  lives--;
  if(lives<=0)state='lose';else{p={r:1,c:1};}
 }else if(en.length==0)state='win';
}
setInterval(()=>{
 if(state!='play')return;
 en.forEach(e=>{
  let d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
  let r=e.r+d[0],c=e.c+d[1];
  if(free(r,c)){e.r=r;e.c=c;}
 });
 check();
},500);
function draw(){
 x.clearRect(0,0,cv.width,cv.height);
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  x.fillStyle=map[r][c]==1?'#455a64':map[r][c]==2?'#a1887f':'#388e3c';
  x.fillRect(c*T,r*T,T-1,T-1);}
 x.fillStyle='#ff9800';
 fires.forEach(f=>x.fillRect(f[1]*T,f[0]*T,T-1,T-1));
 x.fillStyle='#000';
 bombs.forEach(b=>{x.beginPath();x.arc(b.c*T+T/2,b.r*T+T/2,T*0.35,0,7);x.fill();});
 x.fillStyle='#e91e63';
 en.forEach(e=>{x.beginPath();x.arc(e.c*T+T/2,e.r*T+T/2,T*0.35,0,7);x.fill();});
 x.fillStyle='#29b6f6';
 x.beginPath();x.arc(p.c*T+T/2,p.r*T+T/2,T*0.38,0,7);x.fill();
 document.getElementById('i').textContent='Vidas: '+lives+'   Nivel: '+lvl+'   Enemigos: '+en.length;
 if(state!='play'){
  x.fillStyle='rgba(0,0,0,0.7)';x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle='#fff';x.font='bold '+T+'px sans-serif';x.textAlign='center';
  x.fillText(state=='win'?'¡GANASTE!':'PERDISTE',cv.width/2,cv.height/2);
  x.font=(T*0.6)+'px sans-serif';
  x.fillText('Toca para continuar',cv.width/2,cv.height/2+T);
 }
 requestAnimationFrame(draw);
}
cv.addEventListener('pointerdown',()=>{
 if(state=='win'){lvl++;state='play';init();}
 else if(state=='lose'){lives=3;lvl=1;state='play';init();}
});
function hold(id,f){
 const e=document.getElementById(id);let t;
 e.addEventListener('pointerdown',ev=>{ev.preventDefault();f();clearInterval(t);t=setInterval(f,160);});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>clearInterval(t)));
}
hold('u',()=>mv(-1,0));hold('d',()=>mv(1,0));
hold('l',()=>mv(0,-1));hold('r',()=>mv(0,1));
document.getElementById('b').addEventListener('pointerdown',e=>{e.preventDefault();bomb();});
init();draw();
</script></body></html>
