</style></head><body>

<script>
const W=11,H=13,cv=document.getElementById('g'),x=cv.getContext('2d');
const T=Math.floor(Math.min(innerWidth/W,(innerHeight-250)/H));
cv.width=W*T;cv.height=H*T;
x.textAlign='center';x.textBaseline='middle';
let map,items,p,enemies,bombs,fires,lvl=1,state='menu',now=0;
const P={bombs:1,range:2,speed:0,lives:3};
function resetStats(){P.bombs=1;P.range=2;P.speed=0;P.lives=3;lvl=1;}

/* ---------- AJUSTES ---------- */
let S={ctl:'classic',bomb:'B',lefty:false};
try{const s=JSON.parse(localStorage.getItem('bs'));if(s)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem('bs',JSON.stringify(S));}catch(e){}}

/* ---------- AUDIO ---------- */
let ac,master,mus,muted=false,nextT=0,step=0;
const MEL=[69,0,72,0,76,0,74,72, 71,0,67,0,69,0,0,0, 69,0,72,0,76,0,79,76, 74,0,72,0,71,69,67,0];
const ROOT=[45,41,48,43];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,t,d,ty,v,dest){
 const o=ac.createOscillator(),g=ac.createGain();
 o.type=ty;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+0.05);
}
function noise(t,d,v,dest){
 const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=ac.createBufferSource();s.buffer=b;
 const g=ac.createGain();g.gain.value=v;
 s.connect(g);g.connect(dest||master);s.start(t);
}
function playStep(s,t){
 const m=MEL[s];if(m)tone(mtof(m),t,.14,'square',.25,mus);
 const bar=s>>3,i=s&7;
 if(i%2==0)tone(mtof(ROOT[bar]+(i%4?12:0)),t,.2,'triangle',.5,mus);
 if(s%2==1)noise(t,.03,.15,mus);
 if(i==0||i==4)tone(60,t,.1,'sine',.8,mus);
}
function sched(){
 if(!ac)return;
 while(nextT<ac.currentTime+.25){playStep(step%32,nextT);nextT+=.16;step++;}
}
function initAudio(){
 if(!ac){
  const A=window.AudioContext||window.webkitAudioContext;
  if(!A)return;
  ac=new A();
  master=ac.createGain();master.gain.value=muted?0:.6;master.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=.35;mus.connect(master);
  nextT=ac.currentTime+.1;setInterval(sched,60);
 }
 if(ac.state=='suspended')ac.resume();
}
function sfx(n){
 if(!ac)return;const t=ac.currentTime;
 if(n=='put'){tone(300,t,.08,'square',.3);tone(200,t+.06,.08,'square',.3);}
 if(n=='boom'){noise(t,.5,.9);tone(90,t,.3,'sawtooth',.5);}
 if(n=='pow')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.1,'square',.3));
 if(n=='hurt')[400,300,200,120].forEach((f,i)=>tone(f,t+i*.08,.1,'sawtooth',.4));
 if(n=='win')[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,t+i*.12,.14,'square',.35));
 if(n=='lose')[330,294,262,196,165].forEach((f,i)=>tone(f,t+i*.2,.25,'triangle',.6));
}
document.addEventListener('visibilitychange',()=>{
 if(!ac)return;
 if(document.hidden)ac.suspend();else ac.resume();
});
function toggleMute(){
 muted=!muted;
 if(master)master.gain.value=muted?0:.6;
 document.getElementById('m').textContent=muted?'🔇':'🔊';
}

/* ---------- JUEGO ---------- */
function init(){
 map=[];items=[];
 for(let r=0;r<H;r++){map[r]=[];items[r]=[];for(let c=0;c<W;c++){
  items[r][c]=0;
  if(r==0||c==0||r==H-1||c==W-1||(r%2==0&&c%2==0))map[r][c]=1;
  else map[r][c]=(Math.random()<0.45&&!(r<3&&c<3))?2:0;}}
 p={r:1,c:1,x:1,y:1,inv:1500,last:0};
 bombs=[];fires=[];enemies=[];
 const n=Math.min(2+lvl,7),ty=lvl==1?1:lvl==2?2:3;
 while(enemies.length<n){
  let r=1+Math.floor(Math.random()*(H-2)),c=1+Math.floor(Math.random()*(W-2));
  if(map[r][c]==0&&r+c>7){
   let t=Math.floor(Math.random()*ty);
   enemies.push({r,c,x:c,y:r,t,sp:[600,450,320][t],w:500});
  }
 }
}
function free(r,c){return r>=0&&c>=0&&r<H&&c<W&&map[r][c]==0&&!bombs.some(b=>b.r==r&&b.c==c);}
function mv(dr,dc){
 if(state!='play')return;
 if(now-p.last<170-P.speed*25)return;
 let r=p.r+dr,c=p.c+dc;
 if(free(r,c)){p.r=r;p.c=c;p.last=now;check();}
}
function bomb(){
 if(state!='play'||bombs.length>=P.bombs||bombs.some(b=>b.r==p.r&&b.c==p.c))return;
 bombs.push({r:p.r,c:p.c,t:2000,g:P.range});sfx('put');
}
function boom(b){
 if(!bombs.includes(b))return;
 bombs.splice(bombs.indexOf(b),1);
 const cells=[[b.r,b.c]];
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
  for(let k=1;k<=b.g;k++){
   const r=b.r+d[0]*k,c=b.c+d[1]*k;
   if(map[r][c]==1)break;
   cells.push([r,c]);
   if(map[r][c]==2){
    map[r][c]=0;
    if(Math.random()<.3)items[r][c]=['b','f','s'][Math.floor(Math.random()*3)];
    break;
   }
  }});
 cells.forEach(f=>fires.push({r:f[0],c:f[1],t:450}));
 sfx('boom');
 bombs.filter(o=>cells.some(f=>f[0]==o.r&&f[1]==o.c)).forEach(boom);
 check();
}
function hurt(){
 P.lives--;
 if(P.lives<=0){state='lose';sfx('lose');return;}
 sfx('hurt');
 p.r=1;p.c=1;p.x=1;p.y=1;p.inv=2000;
}
function check(){
 if(state!='play')return;
 const onFire=(r,c)=>fires.some(f=>f.r==r&&f.c==c);
 enemies=enemies.filter(e=>!onFire(e.r,e.c));
 if(p.inv<=0&&(onFire(p.r,p.c)||enemies.some(e=>e.r==p.r&&e.c==p.c)))hurt();
 const it=items[p.r][p.c];
 if(it&&state=='play'){
  items[p.r][p.c]=0;
  if(it=='b')P.bombs=Math.min(P.bombs+1,5);
  if(it=='f')P.range=Math.min(P.range+1,6);
  if(it=='s')P.speed=Math.min(P.speed+1,3);
  sfx('pow');
 }
 if(state=='play'&&enemies.length==0){state='win';sfx('win');}
}
function moveEnemy(e){
 const D=[[1,0],[-1,0],[0,1],[0,-1]];
 let d=null;
 if(e.t==1&&Math.random()
